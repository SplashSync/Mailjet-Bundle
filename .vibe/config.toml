permission = "always"

[tools.toolkit_web_getServerPing]
permission = "always"

[tools.toolkit_web_getServerConnect]
permission = "always"

[tools.toolkit_web_getServerInformations]
permission = "always"

[tools.toolkit_web_getServerSelfTest]
permission = "always"

[tools.toolkit_web_getFieldTemplate]
permission = "always"

[tools.toolkit_web_getObjectDescription]
permission = "always"

[tools.toolkit_web_getObjectFields]
permission = "always"

[tools.toolkit_web_getObjectList]
